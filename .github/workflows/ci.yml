name: Validação do EletriCalc
on:
  pull_request:
  push:
    branches: [main, 'develop/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_CACHE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx expo export --platform android --platform ios --output-dir /tmp/eletricalc-native-bundles
